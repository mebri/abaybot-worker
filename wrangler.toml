name = "yegna-gebeya-bot"
main = "worker.js"
compatibility_date = "2024-03-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI (Built-in, zero external API key required)
[ai]
binding = "AI"

# Cloudflare Worker Environment Variables
# Note: Sensitive variables (TELEGRAM_BOT_TOKEN, FIREBASE_PRIVATE_KEY, optional GEMINI_API_KEY)
# should be added via GitHub Secrets or Cloudflare Dashboard (Settings > Variables).
[vars]
REPOST_CHANNEL_ID = "@mebrigranite"
ADMIN_UID = "admin_bot"
ADMIN_EMAIL = "marbatu1@gmail.com"
FIREBASE_PROJECT_ID = "yegna-gebeya"
CLOUDINARY_CLOUD_NAME = "your_cloud_name"
CLOUDINARY_UPLOAD_PRESET = "yegna_ads"
