name = "abaybot-worker"
main = "worker.js"
compatibility_date = "2024-03-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Cloudflare Workers AI (Built-in, zero external API key required)
[ai]
binding = "AI"

# Cloudflare Worker Environment Variables
# Note: Add secrets (TELEGRAM_BOT_TOKEN, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY,
# CLOUDINARY_CLOUD_NAME, GEMINI_API_KEY) in Cloudflare Dashboard:
# Workers & Pages -> abaybot-worker -> Settings -> Variables and Secrets
[vars]
REPOST_CHANNEL_ID = "@mebrigranite"
ADMIN_UID = "admin_bot"
ADMIN_EMAIL = "marbatu1@gmail.com"
FIREBASE_PROJECT_ID = "yegna-gebeya"
CLOUDINARY_UPLOAD_PRESET = "yegna_ads"
